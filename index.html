<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Andressa Branco | Nail Designer</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #0b0b0b;
            color: #f5f5f5;
            font-family: 'Montserrat', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding: 40px 20px;
            position: relative;
            overflow-x: hidden;
        }

        body::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at center, #1a1a1a 0%, #0b0b0b 100%);
            z-index: -1;
        }

        .container {
            width: 100%;
            max-width: 480px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Perfil */
        .profile-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 35px;
            text-align: center;
        }

        .profile-pic-wrapper {
            width: 130px;
            height: 130px;
            border-radius: 50%;
            padding: 4px;
            background: linear-gradient(135deg, #d4af37, #fff2b2, #aa771c);
            margin-bottom: 20px;
            box-shadow: 0 0 25px rgba(212, 175, 55, 0.3);
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #1a1a1a;
        }

        .profile-pic {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
        }

        h1 {
            font-family: 'Cinzel', serif;
            font-size: 28px;
            font-weight: 700;
            color: #d4af37;
            margin-bottom: 5px;
            letter-spacing: 1px;
        }

        .subtitle {
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 4px;
            color: #c5c5c5;
            font-weight: 500;
        }

        /* Links / Botões */
        .links-container {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .btn {
            width: 100%;
            background: rgba(20, 20, 20, 0.7);
            border: 2px solid #d4af37;
            border-radius: 8px;
            padding: 16px 20px;
            color: #f5f5f5;
            text-decoration: none;
            font-weight: 600;
            font-size: 15px;
            letter-spacing: 0.5px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
            cursor: pointer;
        }

        .btn:hover {
            background: linear-gradient(135deg, #d4af37, #aa771c);
            color: #0b0b0b;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(212, 175, 55, 0.4);
            border-color: #fff2b2;
        }

        .btn span {
            flex: 1;
            text-align: center;
        }

        .btn i {
            font-size: 20px;
            color: #d4af37;
            transition: color 0.3s ease;
        }

        .btn:hover i {
            color: #0b0b0b;
        }

        footer {
            margin-top: 40px;
            font-size: 12px;
            color: #777;
            text-align: center;
            letter-spacing: 1px;
        }

        /* Modal Styles */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            padding: 20px;
            backdrop-filter: blur(5px);
        }

        .modal-content {
            background: #141414;
            border: 2px solid #d4af37;
            border-radius: 12px;
            width: 100%;
            max-width: 400px;
            padding: 25px;
            position: relative;
            box-shadow: 0 10px 30px rgba(212, 175, 55, 0.2);
            animation: modalFadeIn 0.3s ease;
        }

        @keyframes modalFadeIn {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .close-modal {
            position: absolute;
            top: 15px;
            right: 15px;
            color: #d4af37;
            font-size: 22px;
            cursor: pointer;
            background: none;
            border: none;
        }

        .modal-title {
            font-family: 'Cinzel', serif;
            color: #d4af37;
            font-size: 18px;
            margin-bottom: 20px;
            text-align: center;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            font-size: 12px;
            color: #bbb;
            margin-bottom: 5px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .form-group select, .form-group input {
            width: 100%;
            padding: 12px;
            background: #1f1f1f;
            border: 1px solid #444;
            border-radius: 6px;
            color: #fff;
            font-family: 'Montserrat', sans-serif;
            font-size: 14px;
        }

        .form-group select:focus, .form-group input:focus {
            border-color: #d4af37;
            outline: none;
        }

        .modal-btn {
            width: 100%;
            background: #d4af37;
            color: #0b0b0b;
            border: none;
            padding: 14px;
            border-radius: 6px;
            font-weight: 700;
            font-size: 14px;
            cursor: pointer;
            margin-top: 10px;
            transition: background 0.3s;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .modal-btn:hover {
            background: #f5cf53;
        }
    </style>
    <!-- FontAwesome para ícones -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <div class="container">
        <!-- Foto e Título -->
        <div class="profile-container">
            <div class="profile-pic-wrapper">
                <!-- Altere aqui se a sua imagem for .png (ex: andressa.png) -->
                <img src="andressa.jpg" alt="Andressa Branco" class="profile-pic" onerror="this.src='https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=400&q=80'">
            </div>
            <h1>Andressa Branco</h1>
            <div class="subtitle">Nail Designer</div>
        </div>

        <!-- Botões de Links -->
        <div class="links-container">
            <a href="https://moldedesucesso.my.canva.site/mais-informa-es" target="_blank" class="btn">
                <i class="fa-solid fa-hand-sparkles"></i>
                <span>SOBRE ALONGAMENTOS</span>
                <i class="fa-solid fa-chevron-right" style="font-size: 12px;"></i>
            </a>

            <button class="btn" onclick="openModal('modalAgendamento')">
                <i class="fa-solid fa-calendar-days"></i>
                <span>AGENDE SEU HORÁRIO</span>
                <i class="fa-solid fa-chevron-right" style="font-size: 12px;"></i>
            </button>

            <a href="https://www.youtube.com/@andressanails" target="_blank" class="btn">
                <i class="fa-brands fa-youtube"></i>
                <span>INSCREVA-SE NO CANAL</span>
                <i class="fa-solid fa-chevron-right" style="font-size: 12px;"></i>
            </a>

            <button class="btn" onclick="openModal('modalCursos')">
                <i class="fa-solid fa-graduation-cap"></i>
                <span>CURSOS E ESPECIALIZAÇÕES</span>
                <i class="fa-solid fa-chevron-right" style="font-size: 12px;"></i>
            </button>

            <a href="http://intagram.com/DEESSAA_29" target="_blank" class="btn">
                <i class="fa-brands fa-instagram"></i>
                <span>PERFIL PESSOAL</span>
                <i class="fa-solid fa-chevron-right" style="font-size: 12px;"></i>
            </a>

            <button class="btn" onclick="openModal('modalParcerias')">
                <i class="fa-solid fa-handshake"></i>
                <span>PARCERIAS</span>
                <i class="fa-solid fa-chevron-right" style="font-size: 12px;"></i>
            </button>
        </div>

        <footer>
            &copy; 2026 Andressa Branco. Todos os direitos reservados.
        </footer>
    </div>

    <!-- MODAL DE AGENDAMENTO -->
    <div id="modalAgendamento" class="modal">
        <div class="modal-content">
            <button class="close-modal" onclick="closeModal('modalAgendamento')">&times;</button>
            <div class="modal-title">Agendar Horário</div>
            <div class="form-group">
                <label>Selecione o Procedimento</label>
                <select id="agendamentoServico">
                    <option value="Fibra de Vidro">Fibra de Vidro</option>
                    <option value="Manutenção de Gel">Manutenção de Gel</option>
                    <option value="Banho de Gel">Banho de Gel</option>
                    <option value="Blindagem">Blindagem</option>
                    <option value="Remoção">Remoção</option>
                </select>
            </div>
            <div class="form-group">
                <label>Data desejada</label>
                <input type="date" id="agendamentoData">
            </div>
            <div class="form-group">
                <label>Horário desejado</label>
                <input type="time" id="agendamentoHora">
            </div>
            <button class="modal-btn" onclick="enviarAgendamento()">Continuar para o WhatsApp</button>
        </div>
    </div>

    <!-- MODAL DE CURSOS -->
    <div id="modalCursos" class="modal">
        <div class="modal-content">
            <button class="close-modal" onclick="closeModal('modalCursos')">&times;</button>
            <div class="modal-title">Dúvidas sobre Cursos</div>
            <div class="form-group">
                <label>Qual curso você tem interesse?</label>
                <select id="cursoTipo">
                    <option value="Curso VIP Presencial">Curso VIP Presencial</option>
                    <option value="Curso Online em Vídeo">Curso Online em Vídeo</option>
                    <option value="Aperfeiçoamento">Aperfeiçoamento</option>
                </select>
            </div>
            <div class="form-group">
                <label>Seu Nome</label>
                <input type="text" id="cursoNome" placeholder="Digite seu nome completo">
            </div>
            <button class="modal-btn" onclick="enviarCurso()">Enviar Dúvida no WhatsApp</button>
        </div>
    </div>

    <!-- MODAL DE PARCERIAS -->
    <div id="modalParcerias" class="modal">
        <div class="modal-content">
            <button class="close-modal" onclick="closeModal('modalParcerias')">&times;</button>
            <div class="modal-title">Proposta de Parceria</div>
            <div class="form-group">
                <label>Nome da Marca / Perfil</label>
                <input type="text" id="parceriaMarca" placeholder="Ex: @suamarca">
            </div>
            <div class="form-group">
                <label>Tipo de Parceria</label>
                <select id="parceriaTipo">
                    <option value="Publi / Divulgação">Publi / Divulgação</option>
                    <option value="Recebidos / Press Kit">Recebidos / Press Kit</option>
                    <option value="Outros">Outros</option>
                </select>
            </div>
            <button class="modal-btn" onclick="enviarParceria()">Enviar Proposta no WhatsApp</button>
        </div>
    </div>

    <script>
        const whatsappNumber = "5511954844089";

        function openModal(modalId) {
            document.getElementById(modalId).style.display = 'flex';
        }

        function closeModal(modalId) {
            document.getElementById(modalId).style.display = 'none';    
        }

        window.onclick = function(event) {
            if (event.target.classList.contains('modal')) {
                event.target.style.display = 'none';
            }
        }

        function enviarAgendamento() {
            const servico = document.getElementById('agendamentoServico').value;
            const data = document.getElementById('agendamentoData').value;
            const hora = document.getElementById('agendamentoHora').value;

            let mensagem = `Olá Andressa! Gostaria de agendar um horário para *${servico}*.`;
            if (data) mensagem += ` Data preferida: *${data}*.`;
            if (hora) mensagem += ` Horário: *${hora}*.`;
            mensagem += ` Poderia verificar a disponibilidade?`;

            const url = `https://api.whatsapp.com/send?phone=${whatsappNumber}&text=${encodeURIComponent(mensagem)}`;
            window.open(url, '_blank');
        }

        function enviarCurso() {
            const curso = document.getElementById('cursoTipo').value;
            const nome = document.getElementById('cursoNome').value;

            let mensagem = `Olá! Meu nome é *${nome || 'Cliente'}* e tenho interesse em saber mais sobre o *${curso}*. Pode me passar informações de valores e datas?`;

            const url = `https://api.whatsapp.com/send?phone=${whatsappNumber}&text=${encodeURIComponent(mensagem)}`;
            window.open(url, '_blank');
        }

        function enviarParceria() {
            const marca = document.getElementById('parceriaMarca').value;
            const tipo = document.getElementById('parceriaTipo').value;

            let mensagem = `Olá Andressa! Entro em contato da marca/perfil *${marca || 'parceira'}* para conversarmos sobre uma parceria do tipo: *${tipo}*. Podemos alinhar?`;

            const url = `https://api.whatsapp.com/send?phone=${whatsappNumber}&text=${encodeURIComponent(mensagem)}`;
            window.open(url, '_blank');
        }
    </script>
</body>
</html>
